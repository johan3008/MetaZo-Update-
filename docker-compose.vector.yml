version: '3.8'

services:
  metazo-vector-engine:
    build:
      context: .
      dockerfile: server/Dockerfile.vector
    image: metazo-vector-inkscape:latest
    container_name: metazo-vector-engine
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      - VECTOR_HOST=0.0.0.0
      - VECTOR_PORT=8089
      - INKSCAPE_PATH=/usr/bin/inkscape
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8089/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
