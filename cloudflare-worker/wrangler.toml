name = "metazo-adobe-stock-ai-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Environment Variables
[vars]
JWT_SECRET = "CHANGE_THIS_TO_A_SECURE_RANDOM_SECRET" # Used for Custom Authentication Tokens
CORS_ORIGIN = "*" # Set to your production frontend URL (e.g., your domain)

# 1. Cloudflare D1 SQL Database Binding
# Create your database: wrangler d1 create metazo-db
# Paste the resulting database_id below
[[d1_databases]]
binding = "DB"
database_name = "metazo-db"
database_id = "60a4d870-56c9-4dc6-9079-789d9e536cea"

# 2. Cloudflare R2 Storage Bucket Binding (Optional, replaces Firebase Storage)
# Create your bucket: wrangler r2 bucket create metazo-assets
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "metazo-assets"
