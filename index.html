
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaZo PRO - AI Microstock Metadata Generator & Keyword Tool (Adobe Stock, Shutterstock, Freepik)</title>
    <link rel="icon" type="image/png" href="/src/assets/images/mz_pro_logo_1780923659277.png">
    <link rel="shortcut icon" type="image/png" href="/src/assets/images/mz_pro_logo_1780923659277.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.5);
        }
        /* Dark mode adjustments to match sidebar darkness */
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
        @keyframes subtle-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.05); }
        }
        @keyframes border-glow-anim {
            0%, 100% { border-color: rgba(59, 130, 246, 0.3); }
            50% { border-color: rgba(99, 102, 241, 0.8); }
        }
        /* Floating background keyframes */
        @keyframes float-blob-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(35px, -65px) scale(1.15); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
        }
        @keyframes float-blob-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-50px, 70px) scale(1.2); }
        }
        @keyframes float-blob-3 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            40% { transform: translate(45px, 45px) scale(0.85); }
        }
        .animate-blob-1 {
            animation: float-blob-1 22s infinite alternate ease-in-out;
        }
        .animate-blob-2 {
            animation: float-blob-2 26s infinite alternate ease-in-out;
        }
        .animate-blob-3 {
            animation: float-blob-3 18s infinite alternate ease-in-out;
        }
        .animate-subtle-float {
            animation: subtle-float 6s ease-in-out infinite;
        }
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
        .border-glow-hover:hover {
            animation: border-glow-anim 2s infinite ease-in-out;
        }
        /* Custom Modern Input styling */
        .modern-input:focus-within {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        /* Grid flow pattern background behind main content */
        @keyframes meteor {
            0% {
                transform: rotate(215deg) translateX(0);
                opacity: 0;
            }
            1% {
                opacity: 1;
            }
            15% {
                opacity: 1;
            }
            30% {
                transform: rotate(215deg) translateX(-800px);
                opacity: 0;
            }
            100% {
                transform: rotate(215deg) translateX(-800px);
                opacity: 0;
            }
        }
        .animate-meteor {
            animation: meteor 15s linear infinite;
        }
        .animate-meteor::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, rgba(99, 102, 241, 0.6), rgba(167, 139, 250, 0.4), transparent);
        }
        .grid-bg {
            background-image: radial-gradient(rgba(99, 102, 241, 0.08) 1px, transparent 1px), radial-gradient(rgba(59, 130, 246, 0.05) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }
        .dark .grid-bg {
            background-image: radial-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px), radial-gradient(rgba(59, 130, 246, 0.03) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
        }
        /* Gorgeous custom styling for cards and layouts */
        .gold-border {
            border-image: linear-gradient(to right, #3b82f6, #6366f1, #ec4899) 1;
        }
        
        /* Subtle cross-fade transition effect for theme switching */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: 0.4s;
            animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            mix-blend-mode: normal;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-100 dark:bg-slate-950">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
